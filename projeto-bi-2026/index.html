      const table=await response.json();
      return table.linhas.map(row=>Object.fromEntries(table.colunas.map((name,i)=>[name,row[i]])));

    D[key]=groups.flat();
  }));
} catch(error) {

const nf=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}),money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),dec=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});

const sum=(rows,k)=>rows.reduce((a,r)=>a+(Number(r[k])||0),0),ratio=(a,b)=>b?a/b:null;

const aggregate=(rows,key,keys)=>{const m=new Map;for(const r of rows){if(!m.has(r[key]))m.set(r[key],Object.fromEntries([[key,r[key]],...keys.map(k=>[k,0])]));let g=m.get(r[key]);keys.forEach(k=>g[k]+=Number(r[k])||0)}return [...m.values()]};

function val(id){return $(id)?.value||''}function is(r,field,id){return !val(id)||r[field]===val(id)}

function table(rows,cols,title,limit=100){visible=rows;columns=cols;$('table-title').textContent=title;$('count').textContent=`${fmt(rows.length)} linhas${rows.length>limit?` · Mostrando as primeiras ${limit}. O CSV contém todas.`:''}`;$('table').innerHTML=rows.length?`<table><thead><tr>${cols.map(([k,l])=>`<th scope="col">${esc(l)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,limit).map(r=>`<tr>${cols.map(([k,l,t])=>`<td>${t?fmt(r[k],t):esc(r[k]??'n.d.')}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum registro corresponde aos filtros.</div>'}
function render(){if(val('start')&&val('end')&&val('start')>val('end')){$('scope').textContent='O mês inicial deve ser anterior ou igual ao final.';cards([]);$('charts').innerHTML='';table([],[],'Intervalo inválido');return}
if(tab==='sales'){const r=D.sales.filter(r=>(!val('start')||r.mes>=val('start'))&&(!val('end')||r.mes<=val('end'))&&is(r,'regiao','region')&&is(r,'canal','channel')&&is(r,'categoria','category')),net=sum(r,'liquido'),gross=sum(r,'bruto'),orders=sum(r,'pedidos'),n=sum(r,'registros');
$('scope').textContent='Filtros desta aba: mês, região do evento, canal do evento e categoria do cenário de primeiro cadastro. Valores financeiros consideram somente pedidos concluídos. Outubro de 2026 contém apenas o dia 01: não comparar diretamente com meses completos.';
$('alert').textContent='Custos e categorias dependem do primeiro registro de produto. Há cadastros conflitantes sem data de vigência. A margem é um cenário exploratório; receita e desconto vêm diretamente das vendas.';
cards([['Receita líquida comercial',net,'money','Bruto menos desconto. Sem impostos ou frete.'],['Margem estimada · cenário',ratio(net-sum(r,'custo'),net),'pct','(Receita − custo do primeiro cadastro) / receita'],['Pedidos concluídos',orders,'n',`${fmt(n)} pedidos de todos os status no filtro`],['Desconto ponderado',ratio(sum(r,'desconto'),gross),'pct','Desconto em R$ / receita bruta concluída'],['Receita bruta concluída',gross,'money','Quantidade × preço unitário'],['Ticket médio',ratio(net,orders),'money','Receita líquida / pedidos concluídos'],['Cancelados + devolvidos',ratio(sum(r,'cancelados')+sum(r,'devolvidos'),n),'pct','Participação nos pedidos de todos os status'],['Margem · último cadastro',ratio(net-sum(r,'custo_ultimo'),net),'pct','Cenário de sensibilidade, sem autoridade temporal']]);
const months=aggregate(r,'mes',['liquido','bruto','desconto','custo','custo_ultimo','pedidos','registros']).sort((a,b)=>a.mes.localeCompare(b.mes));months.forEach(x=>{x.margem=ratio(x.liquido-x.custo,x.liquido);x.ticket=ratio(x.liquido,x.pedidos)});
$('charts').innerHTML=line(months)+bar(aggregate(r,'categoria',['liquido']),'categoria','liquido','Receita por categoria · cenário')+bar(aggregate(r,'regiao',['liquido']),'regiao','liquido','Receita por região da venda')+bar(aggregate(r,'canal',['liquido']),'canal','liquido','Receita por canal da venda');
table(months,[['mes','Mês'],['pedidos','Concluídos','n'],['bruto','Bruto','money'],['desconto','Descontos','money'],['liquido','Receita líquida','money'],['custo','Custo · cenário','money'],['margem','Margem · cenário','pct'],['ticket','Ticket médio','money']],'Evolução mensal');}
if(tab==='clients'){let r=D.clients.filter(r=>is(r,'regiao','region')&&is(r,'segmento','segment')&&is(r,'status_cliente','status'));let buyers=sum(r,'compradores'),n=sum(r,'clientes'),a=sum(r,'atendimentos');

cards([['Clientes no universo',n,'n','IDs distintos em cadastro, vendas, atendimento ou marketing'],['Compradores em 365 dias',buyers,'n','Ao menos uma compra concluída na janela'],['Frequência por comprador',ratio(sum(r,'pedidos'),buyers),'dec','Pedidos concluídos na janela / compradores'],['Recência média',ratio(sum(r,'soma_recencia'),buyers),'dec','Dias desde a última compra na janela'],['Receita na janela RFM',sum(r,'monetario'),'money','Pedidos concluídos nos últimos 365 dias'],['CSAT de atendimento',ratio(sum(r,'satisfeitos'),a),'pct','Notas 4 ou 5 / atendimentos · todo o histórico'],['Reclamações por atendimento',ratio(sum(r,'reclamacoes'),a),'pct','Motivos definidos / atendimentos'],['Atendimentos não resolvidos',ratio(sum(r,'abertos'),a),'pct','Pendente ou escalado no histórico']]);

if(tab==='campaigns'){let r=D.campaigns.filter(r=>(!val('start')||r.mes>=val('start'))&&(!val('end')||r.mes<=val('end'))&&is(r,'campanha','campaign')&&is(r,'meio','medium'));let spend=sum(r,'investimento'),conv=sum(r,'conversoes'),clicks=sum(r,'cliques'),impressions=sum(r,'impressoes'),n=sum(r,'interacoes');

if(tab==='inventory'){let r=D.inventory.filter(r=>is(r,'categoria','category')&&is(r,'risco','risk'));let n=r.length;
$('scope').textContent=`Movimentos: ${D.stock.inicio} a ${D.stock.fim} (${fmt(D.stock.dias)} dias). Cadastro sem data de posição. Filtros desta aba: categoria e faixa de cobertura do cenário de primeiro cadastro.`;
$('alert').textContent='Cobertura é uma hipótese: estoque cadastrado / saída média diária de todo o histórico. Inclui saídas com diferentes motivos. Ajustes e devoluções não têm sinal inequívoco; saldo final, giro contábil e ruptura real não podem ser apurados.';
cards([['Produtos no filtro',n,'n','Uma linha por produto após definição do cenário'],['Estoque cadastrado · cenário',sum(r,'estoque'),'n','Soma de unidades de SKUs diferentes'],['Cobertura abaixo de 30 dias',r.filter(x=>x.cobertura!==null&&x.cobertura<30).length,'n','Sinal para conferência física'],['Cobertura acima de 180 dias',r.filter(x=>x.cobertura!==null&&x.cobertura>180).length,'n','Sinal de excesso potencial'],['Saídas no histórico',sum(r,'saidas'),'n','Todos os motivos de saída'],['Entradas no histórico',sum(r,'entradas'),'n','Não reconciliadas a um saldo inicial'],['Giro contábil',null,'dec','Indisponível: faltam CMV e estoque médio temporal'],['Baixa cobertura · último cadastro',r.filter(x=>x.cobertura_ultimo!==null&&x.cobertura_ultimo<30).length,'n','Sensibilidade no mesmo conjunto de produtos']]);
const groups=aggregate(r,'risco',['estoque','saidas']);groups.forEach(g=>g.produtos=r.filter(x=>x.risco===g.risco).length);const cats=aggregate(r,'categoria',['saidas']);
$('charts').innerHTML=bar(groups,'risco','produtos','Produtos por cobertura · cenário','n')+bar(cats,'categoria','saidas','Saídas por categoria · cenário','n');
let sorted=[...r].sort((a,b)=>(a.cobertura??Infinity)-(b.cobertura??Infinity));table(sorted,[['produto_id','Produto'],['categoria','Categoria · cenário'],['estoque','Estoque · primeiro','n'],['estoque_ultimo','Estoque · último','n'],['saidas','Saídas','n'],['cobertura','Cobertura · primeiro (dias)','dec'],['cobertura_ultimo','Cobertura · último (dias)','dec'],['intensidade','Saídas / estoque · proxy','dec'],['risco','Faixa de cobertura']],'Produtos para investigação',80);}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));buildFilters();render()});
$('export').onclick=()=>{let rows=[columns.map(c=>c[1]),...visible.map(r=>columns.map(c=>r[c[0]]??''))];let csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=`DataABC_${tab}_filtrado.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
buildFilters();render();
</script></body></html>
